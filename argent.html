<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Horsevo · L'argent</title>
<style>
  :root { --fond:#0B0A08; --carte:#15130E; --bord:rgba(241,234,218,.09); --encre:#F1EADA; --gris:#9A917C; --or:#C9A227; --or-vif:#E9C761; --vert:#8FD9AC; --rouge:#E8907E; }
  * { margin:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--fond); color:var(--encre); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif; font-variant-numeric:tabular-nums; padding:18px 16px calc(36px + env(safe-area-inset-bottom)); line-height:1.4; }
  .page { max-width:640px; margin:0 auto; }
  .haut { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--gris); }
  .haut b { color:var(--or); letter-spacing:.42em; font-weight:600; font-size:11px; }
  h1 { font-size:clamp(28px,7vw,40px); font-weight:800; letter-spacing:-.02em; margin:14px 0 2px; line-height:1.05; }
  .sous { font-size:14px; color:var(--gris); }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:20px; padding:18px 18px 16px; margin-top:14px; }
  .carte.or { border-color:rgba(201,162,39,.35); }
  .etiq { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--or); font-weight:700; }
  .grand { font-size:clamp(44px,13vw,64px); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin-top:8px; color:var(--or-vif); white-space:nowrap; }
  .expl { font-size:14px; color:var(--gris); margin-top:10px; line-height:1.5; }
  .expl b { color:var(--encre); font-weight:600; }
  .ligne { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:11px 0; border-top:1px solid var(--bord); font-size:15px; }
  .ligne:first-child { border-top:0; }
  .ligne .k { color:var(--gris); }
  .ligne .v { font-weight:700; color:var(--encre); white-space:nowrap; }
  .ligne .v.or { color:var(--or-vif); } .ligne .v.vert { color:var(--vert); } .ligne .v.rouge { color:var(--rouge); }
  .ligne.total { border-top:2px solid rgba(241,234,218,.25); }
  .ligne.total .k { color:var(--encre); font-weight:600; }
  .ligne.total .v { font-size:20px; }
  .bloc { margin-top:12px; }
  .barre { display:flex; height:10px; border-radius:999px; overflow:hidden; background:rgba(232,144,126,.35); margin-top:14px; }
  .barre i { display:block; background:var(--vert); }
  .tab { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  .tab th { text-align:right; font-weight:600; color:var(--gris); font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:6px 0 8px; }
  .tab th:first-child, .tab td:first-child { text-align:left; }
  .tab td { text-align:right; padding:10px 0; border-top:1px solid var(--bord); white-space:nowrap; }
  .tab td + td, .tab th + th { padding-left:8px; }
  .tab td.or { color:var(--or-vif); font-weight:700; } .tab td.rouge { color:var(--rouge); } .tab td.vert { color:var(--vert); font-weight:600; } .tab td.mut { color:var(--gris); }
  .tab tr.encours td:first-child::after { content:"en cours"; display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:10px; font-weight:700; background:rgba(201,162,39,.14); color:var(--or-vif); vertical-align:middle; }
  .tab-cadre { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -6px; padding:0 6px; }
  @media (max-width:420px) { .tab { font-size:12.5px; } .tab th { font-size:10px; letter-spacing:0; text-transform:none; } .tab td { padding:9px 0; } .tab td + td, .tab th + th { padding-left:4px; } .tab tr.encours td:first-child::after { display:none; } }
  .petit { display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:14px; color:var(--gris); padding:9px 0; border-top:1px solid var(--bord); }
  .petit:first-of-type { border-top:0; }
  .petit b { color:var(--encre); font-weight:700; white-space:nowrap; }
  details { margin-top:14px; background:var(--carte); border:1px solid var(--bord); border-radius:20px; padding:14px 18px; }
  summary { cursor:pointer; list-style:none; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--or); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"+"; font-size:18px; letter-spacing:0; color:var(--gris); }
  details[open] summary::after { content:"−"; }
  summary:focus-visible { outline:2px solid var(--or); outline-offset:4px; border-radius:6px; }
  .lire p { font-size:13.5px; color:var(--gris); margin-top:10px; line-height:1.55; }
  .lire p b { color:var(--encre); font-weight:600; }
  .pied { margin-top:22px; font-size:12px; color:var(--gris); text-align:center; line-height:1.6; }
  .erreur { text-align:center; padding:70px 20px; color:var(--gris); font-size:14px; }
</style>
</head>
<body>
<div class="page">
  <div class="haut"><b>HORSEVO</b><span id="horloge">--:--</span></div>
  <h1>L'argent, en clair.</h1>
  <div class="sous" id="dateLigne">…</div>
  <div id="contenu" class="erreur">Chargement…</div>
</div>
<script>
const JETON = (location.hash || "").slice(1);
const RPC = "https://dqvmnetwdjidykmqaujg.supabase.co/rest/v1/rpc/finances_stats";
const CLE_ANON = "sb_publishable_xV_Q76hgY9MFzjUEeFyo0Q_P0JLm1yb";
// Mois fiscaux Apple (fin le samedi) et versement ~5 semaines après la clôture : pour le prochain virement.
const MOIS_FISCAUX = [
  { nom: "août",      debut: "2026-08-02", fin: "2026-08-29", versement: "2026-10-01" },
  { nom: "septembre", debut: "2026-08-30", fin: "2026-09-26", versement: "2026-11-05" },
  { nom: "octobre",   debut: "2026-09-27", fin: "2026-10-31", versement: "2026-12-03" },
  { nom: "novembre",  debut: "2026-11-01", fin: "2026-11-28", versement: "2027-01-07" },
  { nom: "décembre",  debut: "2026-11-29", fin: "2027-01-02", versement: "2027-02-04" },
];
const eur2 = (n) => (+n).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const dJ = (iso, o) => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", o);
const majuscule = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const nomMois = (ym) => new Date(ym + "-15T12:00:00").toLocaleDateString("fr-FR", { month: "long" });
const deMois = (nom) => (/^[aeiouyàâéèêîôû]/i.test(nom) ? "d'" : "de ") + nom; // « d'octobre », « de septembre »
const enMois = (nom) => "en " + nom;
// Passages au payant dans les événements d'Apple (« Reactivate », pas « Reactivation » ; un changement
// de formule en fin d'essai compte aussi). Recoupé le 1er oct. avec les payants du jour.
const PAYE = /^(Paid Subscription|Renewal|Reactivate\b|(Upgrade|Downgrade|Crossgrade) from Introductory Offer)/;
const arrivees = (j) => Object.entries(j.evenements || {}).filter(([k]) => PAYE.test(k)).reduce((a, [, n]) => a + (+n), 0);

function tictac() { const n = new Date(); document.getElementById("horloge").textContent = n.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
tictac(); setInterval(tictac, 15000);
(function () {
  const n = new Date(); const j = Math.floor((n - new Date("2026-08-02T00:00:00+02:00")) / 86400000);
  document.getElementById("dateLigne").textContent = majuscule(n.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })) + " · " + j + "ᵉ jour depuis le lancement";
})();

async function charger() {
  try {
    const r = await fetch(RPC, { method: "POST", headers: { "Content-Type": "application/json", apikey: CLE_ANON, Authorization: "Bearer " + CLE_ANON }, body: JSON.stringify({ p_token: JETON }) });
    if (!r.ok) throw new Error(await r.text());
    rendre(await r.json());
  } catch (e) {
    document.getElementById("contenu").innerHTML = '<div class="erreur">La page ne s\'ouvre pas.<br>Vérifie le lien complet, avec sa clé après le #.</div>';
  }
}

/** MOIS PAR MOIS (fondateur, 7 oct. 2026 : « il faut le mettre au mois, je veux un truc plus clair, on se
 *  perd ; je veux voir qui reste, qui part, ce qui rentre tous les mois en repartant de 0 à chaque fois, et
 *  l'argent cumulé depuis le début mais en plus petit »). Mois du calendrier ; payants au début = ceux
 *  du dernier jour du mois d'avant ; départs = début + arrivées − fin (arrêts et cartes refusées). */
function parMois(jours) {
  const groupes = new Map();
  for (const j of jours) { const k = j.jour.slice(0, 7); if (!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(j); }
  const out = [];
  let finPrec = 0;
  for (const [ym, js] of [...groupes.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
    const dernier = js[js.length - 1];
    const eur = js.reduce((a, j) => a + (+j.eur), 0);
    const annuels = js.reduce((a, j) => a + (+(((j.par_duree || {}).an || {}).eur) || 0), 0);
    const arr = js.reduce((a, j) => a + arrivees(j), 0);
    const fin = +dernier.payants || 0;
    const departs = Math.max(0, finPrec + arr - fin);
    out.push({ ym, nom: nomMois(ym), jours: js, dernierJour: dernier.jour, eur, annuels, debut: finPrec, arr, departs, fin, essais: dernier.essais, codes: dernier.codes, nouveaux: js.reduce((a, j) => a + (+j.nouveaux || 0), 0) });
    finPrec = fin;
  }
  return out;
}

function rendre(d) {
  const jours = (d.jours || []).slice().sort((a, b) => a.jour.localeCompare(b.jour));
  const mois = parMois(jours);
  const total = +d.total_eur;
  const maj = d.maj ? new Date(d.maj) : null;
  const auj = new Date().toISOString().slice(0, 10);
  const moisAuj = auj.slice(0, 7);
  const dernier = jours[jours.length - 1] || null;

  // Le mois en cours repart de zéro le 1er : tant qu'Apple n'a publié aucune journée du mois, il vaut 0.
  let courant = mois.find((m) => m.ym === moisAuj);
  if (!courant) courant = { ym: moisAuj, nom: nomMois(moisAuj), jours: [], dernierJour: null, eur: 0, annuels: 0, debut: dernier ? +dernier.payants : 0, arr: 0, departs: 0, fin: dernier ? +dernier.payants : 0, essais: dernier ? dernier.essais : 0, codes: dernier ? dernier.codes : 0, nouveaux: 0 };
  const precedent = mois.filter((m) => m.ym < courant.ym).pop() || null;
  const restes = Math.max(0, courant.debut - courant.departs);
  const partRestes = courant.debut ? Math.round((restes / courant.debut) * 100) : null;
  const premierDuMois = dJ(courant.ym + "-01", { day: "numeric", month: "long" }).replace(/^1 /, "1er ");
  const jusquAu = courant.dernierJour ? majuscule(dJ(courant.dernierJour, { weekday: "long", day: "numeric", month: "long" })) : null;

  // Prochain virement réel d'Apple : le premier mois fiscal pas encore versé qui porte de l'argent.
  const netDe = (m) => jours.filter((j) => j.jour >= m.debut && j.jour <= m.fin).reduce((a, j) => a + (+j.eur), 0);
  const enCoursFiscal = MOIS_FISCAUX.find((m) => auj >= m.debut && auj <= m.fin) || MOIS_FISCAUX[MOIS_FISCAUX.length - 1];
  const fiscal = MOIS_FISCAUX.find((m) => m.versement >= auj && (auj <= m.fin || netDe(m) >= 10)) || enCoursFiscal;
  const fiscalClos = auj > fiscal.fin;

  const lignesMois = mois.slice().reverse();
  const quatorze = jours.slice(-14).reverse();
  const departsDuJour = (j) => (+((j.evenements || {})._departs_arrets) || 0) + (+((j.evenements || {})._departs_cartes) || 0);

  document.getElementById("contenu").className = "";
  document.getElementById("contenu").innerHTML = `
    <div class="carte or">
      <div class="etiq">Encaissé ${enMois(courant.nom)}</div>
      <div class="grand">${eur2(courant.eur)}</div>
      <div class="expl">Net, après la TVA et la commission d'Apple. Le compteur repart de zéro le 1er de chaque mois. ${jusquAu
        ? `Compté jusqu'au <b>${jusquAu.toLowerCase()}</b> : Apple publie chaque journée le lendemain vers 16 h 15.`
        : `Apple n'a encore publié aucune journée ${deMois(courant.nom)} : la première arrive le lendemain vers 16 h 15.`}</div>
      ${precedent ? `<div class="ligne" style="margin-top:12px"><span class="k">${majuscule(precedent.nom)}, le mois entier</span><span class="v or">${eur2(precedent.eur)}</span></div>` : ""}
    </div>

    <div class="carte">
      <div class="etiq">${majuscule(courant.nom)} : qui reste, qui part</div>
      <div class="bloc">
        <div class="ligne"><span class="k">Abonnés payants au ${premierDuMois}</span><span class="v">${courant.debut}</span></div>
        <div class="ligne"><span class="k">Nouveaux abonnés payants</span><span class="v vert">+${courant.arr}</span></div>
        <div class="ligne"><span class="k">Partis (arrêt ou carte refusée)</span><span class="v ${courant.departs ? "rouge" : ""}">${courant.departs ? "−" + courant.departs : "0"}</span></div>
        <div class="ligne total"><span class="k">Abonnés payants aujourd'hui</span><span class="v">${courant.fin}</span></div>
      </div>
      ${courant.debut ? `<div class="barre" role="img" aria-label="${restes} restés sur ${courant.debut}"><i style="width:${(restes / courant.debut) * 100}%"></i></div>
      <div class="expl"><b>${restes} sur ${courant.debut}</b> sont restés depuis le ${premierDuMois} (${partRestes} %), ${courant.departs} ${courant.departs > 1 ? "sont partis" : "est parti"}. Encore <b>${courant.essais}</b> en essai gratuit (décision dans les jours qui viennent) et ${courant.codes} codes invités, gratuits.</div>` : ""}
    </div>

    <div class="carte">
      <div class="etiq">Mois par mois</div>
      <div class="tab-cadre"><table class="tab">
        <thead><tr><th>Mois</th><th>Encaissé</th><th>Arrivés</th><th>Partis</th><th>Payants fin</th></tr></thead>
        <tbody>
          ${lignesMois.map((m) => `<tr class="${m.ym === courant.ym ? "encours" : ""}"><td>${majuscule(m.nom)}</td><td class="${m.eur > 0 ? "or" : "mut"}">${eur2(m.eur)}</td><td class="${m.arr ? "vert" : "mut"}">${m.arr ? "+" + m.arr : "0"}</td><td class="${m.departs ? "rouge" : "mut"}">${m.departs ? "−" + m.departs : "0"}</td><td>${m.fin}</td></tr>`).join("")}
        </tbody>
      </table></div>
      ${mois.filter((m) => m.annuels > 0).map((m) => `<div class="expl">${majuscule(m.nom)} compte <b>${eur2(m.annuels)}</b> d'abonnements à l'année, payés d'avance pour douze mois : ils ne repaieront qu'à la date anniversaire.</div>`).join("")}
      ${mois.length && mois[0].eur === 0 ? `<div class="expl">${majuscule(mois[0].nom)} : le premier mois était offert, personne ne payait encore.</div>` : ""}
    </div>

    <div class="carte">
      <div class="etiq">Depuis le lancement</div>
      <div class="bloc">
        <div class="petit"><span>Encaissé net, tout compris</span><b>${eur2(total)}</b></div>
        <div class="petit"><span>Prochain virement d'Apple, ${dJ(fiscal.versement, { weekday: "long", day: "numeric", month: "long" })}</span><b>${eur2(netDe(fiscal))}${fiscalClos ? "" : " à ce jour"}</b></div>
      </div>
    </div>

    <details>
      <summary>Jour par jour, les 14 derniers</summary>
      <div class="tab-cadre"><table class="tab">
        <thead><tr><th>Jour</th><th>Encaissé</th><th>Arrivés</th><th>Partis</th><th>Payants</th></tr></thead>
        <tbody>
          ${quatorze.map((j) => `<tr><td>${majuscule(dJ(j.jour, { weekday: "short" }))} ${+j.jour.slice(8, 10)}/${+j.jour.slice(5, 7)}</td><td class="${+j.eur > 0 ? "or" : "mut"}">${eur2(j.eur)}</td><td class="${arrivees(j) > 0 ? "vert" : "mut"}">${arrivees(j) > 0 ? "+" + arrivees(j) : "0"}</td><td class="${departsDuJour(j) > 0 ? "rouge" : "mut"}">${departsDuJour(j) > 0 ? "−" + departsDuJour(j) : "0"}</td><td>${j.payants}</td></tr>`).join("")}
        </tbody>
      </table></div>
    </details>

    <details class="lire">
      <summary>Comment lire ces chiffres</summary>
      <p><b>Net</b> veut dire après la TVA et la commission d'Apple : c'est ce qui arrive sur le compte de MACOMCHEZDYS, pas le chiffre d'affaires.</p>
      <p><b>Partis.</b> Des abonnés qui payaient et qui ont arrêté, plus les cartes refusées au renouvellement (Apple réessaie pendant 16 jours, la personne revient si le paiement passe). Une résiliation pendant l'essai gratuit n'est pas un départ. Apple ne donne jamais les noms.</p>
      <p><b>Un jour de retard, toujours.</b> Apple publie les ventes d'une journée le lendemain vers 16 h 15, le nombre d'abonnés un peu plus tard dans la soirée.</p>
      <p><b>Le virement.</b> Apple compte par mois fiscaux qui finissent un samedi et verse dans les 45 jours : le montant exact au centime vient de son rapport financier.</p>
    </details>

    <div class="pied">Écrit tout seul depuis les rapports officiels d'Apple.<br>${maj ? "Dernier relevé le " + maj.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) + " à " + maj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : ""}</div>
  `;
}
charger();
</script>
</body>
</html>
