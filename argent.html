<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Horsevo · L'argent</title>
<style>
  :root { --fond:#0B0A08; --carte:#15130E; --bord:rgba(241,234,218,.09); --encre:#F1EADA; --gris:#9A917C; --or:#C9A227; --or-vif:#E9C761; --vert:#8FD9AC; }
  * { margin:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--fond); color:var(--encre); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif; font-variant-numeric:tabular-nums; padding:18px 16px calc(36px + env(safe-area-inset-bottom)); line-height:1.4; }
  .page { max-width:640px; margin:0 auto; }
  .haut { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--gris); }
  .haut b { color:var(--or); letter-spacing:.42em; font-weight:600; font-size:11px; }
  h1 { font-size:clamp(28px,7vw,40px); font-weight:800; letter-spacing:-.02em; margin:14px 0 2px; line-height:1.05; }
  .sous { font-size:14px; color:var(--gris); }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:20px; padding:18px 18px 16px; margin-top:14px; }
  .carte.or { border-color:rgba(201,162,39,.35); }
  .etiq { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--or); font-weight:700; }
  .grand { font-size:clamp(40px,12vw,60px); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin-top:8px; color:var(--or-vif); word-break:keep-all; white-space:nowrap; }
  .grand small { font-size:.5em; font-weight:700; letter-spacing:0; margin-left:4px; color:var(--or); }
  .expl { font-size:14px; color:var(--gris); margin-top:10px; line-height:1.5; }
  .expl b { color:var(--encre); font-weight:600; }
  .ligne { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-top:1px solid var(--bord); font-size:15px; }
  .ligne:first-of-type { border-top:0; }
  .ligne .k { color:var(--gris); }
  .ligne .v { font-weight:700; color:var(--encre); white-space:nowrap; }
  .ligne .v.or { color:var(--or-vif); }
  .tuiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .tuile { background:rgba(241,234,218,.04); border:1px solid var(--bord); border-radius:14px; padding:12px 12px 10px; }
  .tuile .n { font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.1; white-space:nowrap; }
  .tuile .n.eur { font-size:22px; }
  .tuile .n.or { color:var(--or-vif); } .tuile .n.vert { color:var(--vert); }
  .tuile .l { font-size:12px; color:var(--gris); margin-top:4px; line-height:1.3; }
  .tab { width:100%; border-collapse:collapse; margin-top:10px; font-size:13.5px; }
  @media (max-width:420px) { .tab { font-size:12.5px; } .tab th { font-size:10px; letter-spacing:.02em; } .tab td { padding:8px 0; } }
  .tab th { text-align:right; font-weight:600; color:var(--gris); font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:6px 0 8px; }
  .tab th:first-child, .tab td:first-child { text-align:left; }
  .tab td { text-align:right; padding:9px 0; border-top:1px solid var(--bord); white-space:nowrap; }
  .tab td.or { color:var(--or-vif); font-weight:700; } .tab td.vert { color:var(--vert); font-weight:600; } .tab td.mut { color:var(--gris); }
  .tab tr.total td { border-top:2px solid rgba(241,234,218,.25); font-weight:800; }
  .tab-cadre { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -6px; padding:0 6px; }
  .puce { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; background:rgba(143,217,172,.12); color:var(--vert); margin-left:8px; vertical-align:middle; }
  .puce.attente { background:rgba(201,162,39,.14); color:var(--or-vif); }
  .lire p { font-size:13.5px; color:var(--gris); margin-top:8px; line-height:1.55; }
  .lire p b { color:var(--encre); font-weight:600; }
  .pied { margin-top:22px; font-size:12px; color:var(--gris); text-align:center; line-height:1.6; }
  .erreur { text-align:center; padding:70px 20px; color:var(--gris); font-size:14px; }
  @media (min-width:560px) { .tuiles { grid-template-columns:repeat(4,1fr); } }
</style>
</head>
<body>
<div class="page">
  <div class="haut"><b>HORSEVO</b><span id="horloge">--:--</span></div>
  <h1>L'argent, en clair.</h1>
  <div class="sous" id="dateLigne">…</div>
  <div id="contenu" class="erreur">Chargement…</div>
</div>
<script>
const JETON = (location.hash || "").slice(1);
const RPC = "https://dqvmnetwdjidykmqaujg.supabase.co/rest/v1/rpc/finances_stats";
const CLE_ANON = "sb_publishable_xV_Q76hgY9MFzjUEeFyo0Q_P0JLm1yb";
const NET_MENSUEL = 7.08;            // ce qu'Apple reverse sur un abonnement à 9,99 € (TVA puis commission retirées)
// Mois fiscaux Apple (semaines de 4 ou 5, fin le samedi) et versement ~5 semaines après la clôture.
const MOIS_FISCAUX = [
  { nom: "août",      debut: "2026-08-02", fin: "2026-08-29", versement: "2026-10-01" },
  { nom: "septembre", debut: "2026-08-30", fin: "2026-09-26", versement: "2026-11-05" },
  { nom: "octobre",   debut: "2026-09-27", fin: "2026-10-31", versement: "2026-12-03" },
  { nom: "novembre",  debut: "2026-11-01", fin: "2026-11-28", versement: "2027-01-07" },
  { nom: "décembre",  debut: "2026-11-29", fin: "2027-01-02", versement: "2027-02-04" },
];
const eur2 = (n) => (+n).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const dJ = (iso, o) => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", o);
const majuscule = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const PAYE = /^(Paid Subscription|Renewal|Reactivate\b|(Upgrade|Downgrade|Crossgrade) from Introductory Offer)/;
// (1er oct. 2026) Apple écrit « Reactivate » (retour au payant), pas « Reactivation » : l'ancien motif
// ratait ces retours et comptait à tort « Reactivation to Offer Code » (code promo, gratuit). Un
// changement de formule en fin d'essai (« Downgrade from Introductory Offer »…) est aussi un
// passage au payant. Recoupé : le total des passages = les 142 payants du 29 sept.

function tictac() { const n = new Date(); document.getElementById("horloge").textContent = n.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
tictac(); setInterval(tictac, 15000);
(function () {
  const n = new Date(); const j = Math.floor((n - new Date("2026-08-02T00:00:00+02:00")) / 86400000);
  document.getElementById("dateLigne").textContent = majuscule(n.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })) + " · " + j + "ᵉ jour depuis le lancement";
})();

async function charger() {
  try {
    const r = await fetch(RPC, { method: "POST", headers: { "Content-Type": "application/json", apikey: CLE_ANON, Authorization: "Bearer " + CLE_ANON }, body: JSON.stringify({ p_token: JETON }) });
    if (!r.ok) throw new Error(await r.text());
    rendre(await r.json());
  } catch (e) {
    document.getElementById("contenu").innerHTML = '<div class="erreur">La page ne s\'ouvre pas.<br>Vérifie le lien complet, avec sa clé après le #.</div>';
  }
}

function rendre(d) {
  const jours = (d.jours || []).slice().sort((a, b) => a.jour.localeCompare(b.jour));
  const dernier = jours[jours.length - 1] || { jour: null, essais: 0, codes: 0, payants: 0, nouveaux: 0, eur: 0 };
  const total = +d.total_eur;
  const maj = d.maj ? new Date(d.maj) : null;
  const auj = new Date().toISOString().slice(0, 10);

  // Mois fiscal en cours et ce qu'il contient déjà
  const mois = MOIS_FISCAUX.find((m) => auj >= m.debut && auj <= m.fin) || MOIS_FISCAUX[MOIS_FISCAUX.length - 1];
  const dansMois = jours.filter((j) => j.jour >= mois.debut && j.jour <= mois.fin);
  const netMois = dansMois.reduce((a, j) => a + (+j.eur), 0);
  const devises = {};
  for (const j of jours) for (const [dev, v] of Object.entries(j.devises || {})) devises[dev] = (devises[dev] || 0) + (+v);
  const horsEur = Object.entries(devises).filter(([dev, v]) => dev !== "EUR" && v > 0);
  const eurExact = devises.EUR || 0;
  const paiesDuJour = (j) => Object.entries(j.evenements || {}).filter(([k]) => PAYE.test(k)).reduce((a, [, n]) => a + (+n), 0);
  const totalPayes = jours.reduce((a, j) => a + paiesDuJour(j), 0);
  // Que du RÉEL (fondateur, 1er oct. 2026 : « je veux que de la vraie stat ») : plus de projection
  // « × 7,08 € s'ils restent », l'encaissé net réellement versé sur les 7 derniers jours relevés.
  const semaine = jours.slice(-7);
  const net7 = semaine.reduce((a, j) => a + (+j.eur), 0);
  const versementLong = majuscule(dJ(mois.versement, { weekday: "long", day: "numeric", month: "long" }));
  const finMois = dJ(mois.fin, { day: "numeric", month: "long" });
  const debutMois = dJ(mois.debut, { day: "numeric", month: "long" });

  const quatorze = jours.slice(-14).reverse();
  const totQ = quatorze.reduce((a, j) => ({ eur: a.eur + (+j.eur), payes: a.payes + paiesDuJour(j), nouveaux: a.nouveaux + (j.nouveaux || 0) }), { eur: 0, payes: 0, nouveaux: 0 });

  document.getElementById("contenu").className = "";
  document.getElementById("contenu").innerHTML = `
    <div class="carte or">
      <div class="etiq">Ce qu'Apple te doit aujourd'hui</div>
      <div class="grand">${eur2(total)}</div>
      <div class="expl">Encaissé <b>net</b> depuis le lancement, TVA et commission Apple déjà retirées : c'est la somme qui arrivera sur le compte, pas le chiffre d'affaires.</div>
      <div class="ligne" style="margin-top:12px"><span class="k">Dernière journée comptée</span><span class="v">${dernier.jour ? majuscule(dJ(dernier.jour, { weekday: "long", day: "numeric", month: "long" })) : "—"}</span></div>
      <div class="ligne"><span class="k">Encaissé ce jour-là</span><span class="v or">${eur2(dernier.eur)}</span></div>
      <div class="ligne"><span class="k">Personnes passées au payant depuis le début</span><span class="v">${totalPayes}</span></div>
    </div>

    <div class="carte">
      <div class="etiq">Prochain virement d'Apple</div>
      <div class="grand" style="font-size:clamp(26px,7.5vw,40px);color:var(--encre)">${versementLong}</div>
      <div class="expl"><b>${eur2(netMois)} à ce jour</b>, sur le compte de MACOMCHEZDYS. C'est le mois fiscal Apple de ${mois.nom}, du ${debutMois} au ${finMois} : le montant grandit chaque jour jusqu'au ${finMois}, puis Apple le fige et le verse cinq semaines plus tard.</div>
      <div class="expl">${horsEur.length ? `Dedans, <b>${horsEur.map(([dev, v]) => v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + dev).join(", ")}</b> encaissés en devises, convertis au taux officiel du jour de la Banque centrale européenne : Apple appliquera son propre taux au virement, à quelques euros près sur cette part. La part en euros, <b>${eur2(eurExact)}</b>, est exacte.` : "Tout est encaissé en euros : le montant est exact."}</div>
    </div>

    <div class="carte">
      <div class="etiq">Où on en est</div>
      <div class="tuiles">
        <div class="tuile"><div class="n or">${dernier.payants}</div><div class="l">abonnés payants (au mois ou à l'année), selon Apple</div></div>
        <div class="tuile"><div class="n eur">${eur2(net7)}</div><div class="l">encaissé net sur les ${semaine.length} derniers jours relevés</div></div>
        <div class="tuile"><div class="n">${dernier.essais}</div><div class="l">en essai gratuit, décision dans les jours qui viennent</div></div>
        <div class="tuile"><div class="n">${dernier.codes}</div><div class="l">codes invités actifs (gratuits)</div></div>
      </div>
      <div class="expl" style="margin-top:12px">Sur les <b>${dernier.essais + dernier.codes + dernier.payants}</b> personnes qui ont l'app ouverte aujourd'hui, <b>${dernier.payants}</b> paient. Nouveaux essais au dernier relevé : <b>+${dernier.nouveaux}</b>.</div>
    </div>

    <div class="carte">
      <div class="etiq">Jour par jour, les 14 derniers</div>
      <div class="tab-cadre"><table class="tab">
        <thead><tr><th>Jour</th><th>Encaissé</th><th>Nouv. payants</th><th>Total payants</th><th>Essais</th></tr></thead>
        <tbody>
          ${quatorze.map((j) => `<tr><td>${majuscule(dJ(j.jour, { weekday: "short", day: "numeric", month: "short" }))}</td><td class="${+j.eur > 0 ? "or" : "mut"}">${eur2(j.eur)}</td><td class="${paiesDuJour(j) > 0 ? "vert" : "mut"}">${paiesDuJour(j) > 0 ? "+" + paiesDuJour(j) : "0"}</td><td>${j.payants}</td><td class="mut">+${j.nouveaux || 0}</td></tr>`).join("")}
          <tr class="total"><td>14 jours</td><td class="or">${eur2(totQ.eur)}</td><td class="vert">+${totQ.payes}</td><td></td><td class="mut">+${totQ.nouveaux}</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="carte lire">
      <div class="etiq">Comment lire cette page</div>
      <p><b>Net</b> veut dire après la TVA et la commission d'Apple. Sur un abonnement à 9,99 €, il reste ${NET_MENSUEL.toLocaleString("fr-FR")} €.</p>
      <p><b>Un jour de retard, toujours.</b> Apple publie les ventes d'une journée le lendemain vers 16 h 15 : la ligne d'aujourd'hui apparaîtra demain. Le nombre d'abonnés payants arrive un peu plus tard dans la soirée.</p>
      <p><b>Le virement.</b> Apple compte par mois fiscaux qui se terminent un samedi, puis verse dans les 45 jours. Le premier virement, celui du mois de ${mois.nom}, est attendu le ${versementLong.toLowerCase()}. Le montant devient définitif quand Apple publie son rapport financier, quelques jours après le ${finMois} : cette page l'affichera alors tel quel.</p>
    </div>

    <div class="pied">Écrit tout seul depuis les rapports officiels d'Apple.<br>${maj ? "Dernier relevé le " + maj.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) + " à " + maj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : ""}</div>
  `;
}
charger();
</script>
</body>
</html>
