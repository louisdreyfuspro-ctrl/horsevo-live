<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Horsevo · L'argent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Cormorant+Garamond:ital,wght@1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap">
<style>
  :root {
    --fond: #0A0906;
    --carte: rgba(244, 239, 226, .028);
    --ligne: rgba(201, 162, 39, .16);
    --ligne-faible: rgba(201, 162, 39, .07);
    --or: #C9A227;
    --or-vif: #EBCA63;
    --or-pale: #8C7420;
    --ivoire: #F4EFE2;
    --gris: #978E79;
    --vert: #86DCA8;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--fond);
    color: var(--ivoire);
    font-family: 'Poppins', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    padding: 22px 16px calc(34px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  /* Voile lumineux qui RESPIRE, en boucle lente — la pièce est vivante. */
  body::before {
    content: ""; position: fixed; inset: -20% -10% auto;
    height: 70vh; pointer-events: none; z-index: 0;
    background: radial-gradient(60% 60% at 50% 20%, rgba(201,162,39,.13), transparent 70%);
    animation: respire 9s ease-in-out infinite;
  }
  @keyframes respire { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .page { max-width: 920px; margin: 0 auto; position: relative; z-index: 1; }

  /* ── En-tête ─────────────────────────────────────────────────── */
  .haut { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marque { font-size: 12px; font-weight: 600; letter-spacing: .52em; color: var(--or); }
  .direct { display: flex; align-items: center; gap: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .14em; color: var(--gris); }
  .point {
    width: 7px; height: 7px; border-radius: 50%; background: var(--or-vif);
    animation: pouls 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes pouls {
    0% { box-shadow: 0 0 0 0 rgba(235,202,99,.45); }
    70% { box-shadow: 0 0 0 9px rgba(235,202,99,0); }
    100% { box-shadow: 0 0 0 0 rgba(235,202,99,0); }
  }
  h1 {
    font-family: 'Libre Caslon Display', Georgia, serif;
    font-weight: 400; font-size: clamp(30px, 6.4vw, 44px);
    margin: 22px 0 6px; text-wrap: balance;
  }
  .sous { color: var(--gris); font-size: 13px; max-width: 56ch; line-height: 1.55; }

  /* ── Le compteur ─────────────────────────────────────────────── */
  .scene {
    margin-top: 26px; text-align: center; padding: 44px 12px 40px;
    border-radius: 26px; position: relative; overflow: hidden;
    border: 1px solid var(--ligne);
    background:
      linear-gradient(180deg, rgba(201,162,39,.075), rgba(201,162,39,.012) 55%),
      radial-gradient(120% 90% at 50% 115%, rgba(201,162,39,.06), transparent 60%);
  }
  .scene .libelle {
    font-size: 11px; font-weight: 600; letter-spacing: .38em; color: var(--or);
  }
  .euros {
    font-family: 'IBM Plex Mono', monospace; font-weight: 500;
    font-size: clamp(52px, 13vw, 96px); line-height: 1.05; margin-top: 10px;
    font-variant-numeric: tabular-nums; position: relative; display: inline-block;
    background: linear-gradient(100deg, #B9932A 0%, #EBCA63 38%, #FFF3C4 50%, #EBCA63 62%, #B9932A 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: reflet 5.5s ease-in-out infinite;
    filter: drop-shadow(0 0 26px rgba(201,162,39,.28));
  }
  @keyframes reflet { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
  .depuis {
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
    font-size: 16px; color: var(--gris); margin-top: 10px;
  }

  /* ── Le bandeau défilant ─────────────────────────────────────── */
  .bande {
    margin-top: 16px; border-block: 1px solid var(--ligne-faible);
    overflow: hidden; white-space: nowrap; padding: 9px 0;
    mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .bande .rail { display: inline-block; animation: defile 36s linear infinite; }
  @keyframes defile { to { transform: translateX(-50%); } }
  .bande span {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: .16em;
    color: var(--gris); padding: 0 22px;
  }
  .bande b { color: var(--or-vif); font-weight: 600; }
  .bande i { color: var(--or-pale); font-style: normal; padding: 0 4px; }

  /* ── Les cartes ──────────────────────────────────────────────── */
  .cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; margin-top: 16px; }
  .carte {
    background: var(--carte); border: 1px solid var(--ligne-faible); border-radius: 18px;
    padding: 16px 17px 13px; transition: border-color .3s;
  }
  .carte:hover { border-color: var(--ligne); }
  .carte .v {
    font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 28px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .carte .v.or { color: var(--or-vif); }
  .carte .v.vert { color: var(--vert); }
  .carte .l { font-size: 11px; color: var(--gris); margin-top: 4px; line-height: 1.4; }

  /* ── L'horizon ───────────────────────────────────────────────── */
  .horizon {
    margin-top: 16px; border: 1px solid var(--ligne-faible); border-radius: 20px;
    padding: 20px 20px 18px; background: var(--carte);
  }
  .horizon .titre {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .horizon h2 {
    font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: 21px;
  }
  .horizon .cible { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--gris); letter-spacing: .08em; }
  .piste {
    margin-top: 16px; height: 10px; border-radius: 999px; position: relative;
    background: rgba(244,239,226,.05); border: 1px solid var(--ligne-faible);
  }
  .piste .fait {
    position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--or-pale), var(--or-vif));
    box-shadow: 0 0 14px rgba(201,162,39,.4);
    transition: width 1.6s cubic-bezier(.2, .7, .2, 1);
  }
  .bornes { display: flex; justify-content: space-between; margin-top: 9px; }
  .borne { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--gris); letter-spacing: .04em; }
  .borne b { color: var(--ivoire); font-weight: 500; display: block; font-size: 12px; }
  .horizon .note {
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
    color: var(--gris); font-size: 15.5px; margin-top: 14px;
  }
  .horizon .note b { color: var(--or-vif); font-weight: 500; }

  /* ── Le graphe ───────────────────────────────────────────────── */
  .bloc-graphe {
    margin-top: 16px; background: var(--carte); border: 1px solid var(--ligne-faible);
    border-radius: 20px; padding: 18px 16px 8px;
  }
  .barre-choix { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .choix { display: flex; gap: 6px; }
  .choix button {
    font: 500 12px 'Poppins', sans-serif; letter-spacing: .08em;
    color: var(--gris); background: transparent; border: 1px solid var(--ligne-faible);
    border-radius: 999px; padding: 8px 18px; cursor: pointer; transition: all .22s;
  }
  .choix button.on { color: #14120D; background: var(--or); border-color: var(--or); font-weight: 600; }
  .choix button:not(.on):hover { border-color: var(--ligne); color: var(--ivoire); }
  .serie { font-size: 11px; color: var(--gris); font-family: 'IBM Plex Mono', monospace; }
  .serie b { color: var(--or-vif); font-weight: 600; }
  canvas { width: 100%; height: 270px; display: block; margin-top: 12px; }
  .legende { display: flex; gap: 18px; font-size: 11px; color: var(--gris); padding: 10px 4px 8px; }
  .pastille { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }

  .erreur { text-align: center; padding: 70px 20px; color: var(--gris); font-size: 14px; }
  .pied {
    text-align: center; margin-top: 30px;
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
    font-size: 16px; color: var(--gris);
  }
  .pied b { color: var(--or-vif); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    body::before, .euros, .point, .bande .rail { animation: none !important; }
    .piste .fait { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="haut">
    <div class="marque">H O R S E V O</div>
    <div class="direct"><span class="point"></span><span id="maj">EN DIRECT</span></div>
  </div>
  <h1>L'argent, en direct.</h1>
  <div class="sous">Chiffres officiels App Store, relevés chaque jour. Ce qui s'affiche ici est le net encaissé, après TVA et commission Apple : l'argent vraiment gagné.</div>

  <div id="contenu" class="erreur">Connexion aux chiffres…</div>
</div>

<script>
const JETON = (location.hash || "").slice(1);
const RPC = "https://dqvmnetwdjidykmqaujg.supabase.co/rest/v1/rpc/finances_stats";
const CLE_ANON = "sb_publishable_xV_Q76hgY9MFzjUEeFyo0Q_P0JLm1yb";
const NET_MENSUEL = 7.08;
const SEUIL = 350; // le cap fondateur : 350 abonnés = 2 500 € nets / mois
let donnees = null;
let vue = "jour";

const eur = (n) => n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const eurCourt = (n) => n >= 1000 ? (n / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " k€" : Math.round(n) + " €";

async function charger() {
  try {
    const r = await fetch(RPC, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: CLE_ANON, Authorization: "Bearer " + CLE_ANON },
      body: JSON.stringify({ p_token: JETON }),
    });
    if (!r.ok) throw new Error(await r.text());
    donnees = await r.json();
    rendre();
  } catch (e) {
    document.getElementById("contenu").innerHTML =
      '<div class="erreur">Accès refusé ou chiffres indisponibles.<br>Vérifie le lien complet, avec sa clé après le #.</div>';
  }
}

function agreger(jours, mode) {
  if (mode === "jour") return jours.slice(-31).map(j => ({ cle: j.jour.slice(8) + "/" + j.jour.slice(5, 7), eur: +j.eur, nouveaux: j.nouveaux }));
  const g = new Map();
  for (const j of jours) {
    const cle = mode === "mois" ? j.jour.slice(5, 7) + "/" + j.jour.slice(2, 4) : j.jour.slice(0, 4);
    const cur = g.get(cle) || { cle, eur: 0, nouveaux: 0 };
    cur.eur += +j.eur; cur.nouveaux += j.nouveaux;
    g.set(cle, cur);
  }
  return [...g.values()];
}

function rendre() {
  const d = donnees;
  const jours = d.jours || [];
  const dernier = jours[jours.length - 1] || { essais: 0, codes: 0, payants: 0, nouveaux: 0 };
  const total = +d.total_eur;
  const mrr = dernier.payants * NET_MENSUEL;
  const pct = Math.min(100, dernier.payants / SEUIL * 100);
  const maj = d.maj ? new Date(d.maj) : null;
  document.getElementById("maj").textContent = maj
    ? "RELEVÉ " + maj.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) + " · " + maj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    : "EN DIRECT";

  const ticker = `
    <span><i>◆</i> <b>${dernier.essais}</b> ESSAIS EN COURS</span>
    <span><i>◆</i> <b>+${dernier.nouveaux}</b> NOUVEAUX AU DERNIER RELEVÉ</span>
    <span><i>◆</i> <b>${dernier.payants}</b> ABONNÉS PAYANTS</span>
    <span><i>◆</i> MRR <b>${eurCourt(mrr)}</b></span>
    <span><i>◆</i> CAP <b>${SEUIL} ABONNÉS</b> = 2 500 € / MOIS</span>
    <span><i>◆</i> PREMIÈRES CONVERSIONS ATTENDUES LE <b>05.09</b></span>`;

  document.getElementById("contenu").className = "";
  document.getElementById("contenu").innerHTML = `
    <div class="scene">
      <div class="libelle">NET ENCAISSÉ</div>
      <div class="euros" id="gros">0,00&nbsp;€</div>
      <div class="depuis">depuis le lancement, le 2 août 2026</div>
    </div>

    <div class="bande"><div class="rail">${ticker}${ticker}</div></div>

    <div class="cartes">
      <div class="carte"><div class="v or" id="cPayants">0</div><div class="l">abonnés qui paient aujourd'hui</div></div>
      <div class="carte"><div class="v" id="cMrr">0&nbsp;€</div><div class="l">revenu mensuel récurrent</div></div>
      <div class="carte"><div class="v" id="cEssais">0</div><div class="l">essais gratuits en cours</div></div>
      <div class="carte"><div class="v" id="cCodes">0</div><div class="l">codes invités actifs</div></div>
      <div class="carte"><div class="v vert" id="cNvx">0</div><div class="l">nouveaux essais au dernier relevé</div></div>
    </div>

    <div class="horizon">
      <div class="titre">
        <h2>L'horizon</h2>
        <div class="cible">${dernier.payants} / ${SEUIL} ABONNÉS</div>
      </div>
      <div class="piste"><div class="fait" id="piste"></div></div>
      <div class="bornes">
        <div class="borne"><b>0</b>départ</div>
        <div class="borne" style="text-align:right"><b>${SEUIL} abonnés</b>le cap fondateur · 2 500 € nets / mois</div>
      </div>
      <div class="note">Après ce cap : <b>907</b> fin 2026 en trajectoire attendue, <b>10 000</b> à l'échelle du marché européen — et chaque abonné vaut <b>118 €</b> sur sa durée de vie.</div>
    </div>

    <div class="bloc-graphe">
      <div class="barre-choix">
        <div class="choix">
          <button data-v="jour">Jour</button>
          <button data-v="mois">Mois</button>
          <button data-v="an">Année</button>
        </div>
        <div class="serie" id="serie"></div>
      </div>
      <canvas id="graphe"></canvas>
      <div class="legende">
        <span><span class="pastille" style="background:var(--or-vif)"></span>encaissé (€)</span>
        <span><span class="pastille" style="background:var(--vert)"></span>nouveaux essais</span>
      </div>
    </div>

    <div class="pied">La passion mérite d'être vue — <b>et comptée</b>.</div>
  `;

  animer("gros", total, (v) => eur(v));
  animerNombre("cPayants", dernier.payants);
  document.getElementById("cMrr").textContent = eurCourt(mrr);
  animerNombre("cEssais", dernier.essais);
  animerNombre("cCodes", dernier.codes);
  document.getElementById("cNvx").textContent = "+" + dernier.nouveaux;
  requestAnimationFrame(() => { document.getElementById("piste").style.width = Math.max(pct, dernier.payants > 0 ? 1.5 : 0) + "%"; });

  document.querySelectorAll(".choix button").forEach((b) => {
    b.classList.toggle("on", b.dataset.v === vue);
    b.onclick = () => { vue = b.dataset.v; rendre(); };
  });
  requestAnimationFrame(() => dessiner(agreger(jours, vue === "an" ? "an" : vue)));
}

function animer(id, cible, fmt) {
  const el = document.getElementById(id);
  const debut = performance.now(), duree = 1400;
  (function pas(t) {
    const p = Math.min(1, (t - debut) / duree);
    el.textContent = fmt(cible * (1 - Math.pow(1 - p, 4)));
    if (p < 1) requestAnimationFrame(pas);
  })(debut);
}
function animerNombre(id, cible) {
  animer(id, cible, (v) => Math.round(v).toString());
}

let animGraphe = 0;
function dessiner(pts) {
  const cv = document.getElementById("graphe");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || cv.parentElement?.clientWidth || 680, H = 270;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext("2d");
  const monAnim = ++animGraphe;
  const debut = performance.now(), duree = 900;

  function trame(t) {
    if (monAnim !== animGraphe) return;
    const prog = Math.min(1, (t - debut) / duree);
    const ease = 1 - Math.pow(1 - prog, 3);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    if (!pts.length) return;

    const padG = 8, padD = 8, padH = 16, padB = 32;
    const lw = W - padG - padD, lh = H - padH - padB;
    const maxEur = Math.max(10, ...pts.map(p => p.eur));
    const maxNvx = Math.max(4, ...pts.map(p => p.nouveaux));
    const n = pts.length;
    const pas = lw / n;
    const larg = Math.min(36, Math.max(4, pas * 0.55));

    c.strokeStyle = "rgba(201,162,39,.08)"; c.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      const y = padH + lh - (lh * i / 3);
      c.beginPath(); c.moveTo(padG, y); c.lineTo(W - padD, y); c.stroke();
    }

    for (let i = 0; i < n; i++) {
      const x = padG + pas * i + (pas - larg) / 2;
      const h = Math.max(pts[i].eur > 0 ? 3 : 0, lh * pts[i].eur / maxEur) * ease;
      const y = padH + lh - h;
      if (h > 0) {
        const g = c.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, "#EBCA63"); g.addColorStop(1, "rgba(201,162,39,.22)");
        c.fillStyle = g;
        c.shadowColor = "rgba(201,162,39,.5)"; c.shadowBlur = 12;
        c.beginPath(); c.roundRect(x, y, larg, h, [3, 3, 0, 0]); c.fill();
        c.shadowBlur = 0;
      } else {
        c.fillStyle = "rgba(201,162,39,.16)";
        c.fillRect(x, padH + lh - 1.5, larg, 1.5);
      }
    }

    // aire + ligne des nouveaux essais, tracé PROGRESSIF (le graphe s'écrit)
    const nVisibles = Math.max(2, Math.ceil(n * ease));
    const px = (i) => padG + pas * i + pas / 2;
    const py = (i) => padH + lh - lh * pts[i].nouveaux / maxNvx;
    c.beginPath();
    c.moveTo(px(0), padH + lh);
    for (let i = 0; i < nVisibles; i++) c.lineTo(px(i), py(i));
    c.lineTo(px(nVisibles - 1), padH + lh);
    c.closePath();
    const ga = c.createLinearGradient(0, padH, 0, padH + lh);
    ga.addColorStop(0, "rgba(134,220,168,.14)"); ga.addColorStop(1, "rgba(134,220,168,0)");
    c.fillStyle = ga; c.fill();

    c.strokeStyle = "#86DCA8"; c.lineWidth = 1.7; c.lineJoin = "round";
    c.beginPath();
    for (let i = 0; i < nVisibles; i++) i ? c.lineTo(px(i), py(i)) : c.moveTo(px(i), py(i));
    c.stroke();
    if (prog >= 1) {
      c.fillStyle = "#86DCA8";
      for (let i = 0; i < n; i++) { c.beginPath(); c.arc(px(i), py(i), 2.2, 0, 7); c.fill(); }
    }

    c.fillStyle = "rgba(151,142,121,.95)";
    c.font = "10px 'IBM Plex Mono', monospace";
    c.textAlign = "center";
    const saut = Math.ceil(n / 8);
    for (let i = 0; i < n; i += saut) c.fillText(pts[i].cle, px(i), H - 12);

    if (prog < 1) requestAnimationFrame(trame);
  }
  requestAnimationFrame(trame);

  const totalVue = pts.reduce((a, p) => a + p.eur, 0);
  document.getElementById("serie").innerHTML =
    `${pts.length} ${vue === "jour" ? "JOURS" : vue === "mois" ? "MOIS" : "ANS"} · <b>${eurCourt(totalVue)}</b>`;
}

charger();
setInterval(charger, 5 * 60 * 1000);
window.addEventListener("resize", () => donnees && rendre());
document.addEventListener("visibilitychange", () => !document.hidden && donnees && rendre());
</script>
</body>
</html>
