<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Horsevo — en direct</title>
<style>
  :root {
    --or: #E0A237;
    --ink: #F5F1E8;
    --mute: #8E8874;
    --line: #1C1A17;
    --surface: #0A0A0A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* éclair doré au moment d'une inscription */
  #flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 60;
    box-shadow: inset 0 0 160px 0 rgba(224,162,55,0);
    transition: box-shadow 1.1s cubic-bezier(.22,1,.36,1);
  }
  #flash.on { box-shadow: inset 0 0 160px 0 rgba(224,162,55,.42); transition-duration: .12s; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding-bottom: 22px; border-bottom: 1px solid var(--line);
  }
  .marque {
    font-size: 15px; font-weight: 700; letter-spacing: .26em;
    color: var(--or); text-transform: uppercase;
  }
  .live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 700; letter-spacing: .16em;
    color: #E8534A; text-transform: uppercase; white-space: nowrap;
  }
  .pastille {
    width: 7px; height: 7px; border-radius: 50%; background: #E8534A;
    animation: battement 1.8s ease-in-out infinite;
  }
  @keyframes battement { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }
  header .droite { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .horloge { font-size: 12px; color: var(--mute); white-space: nowrap; }
  @media (max-width: 640px) { .horloge { display: none; } }
  .son {
    background: none; border: 1px solid var(--line); color: var(--mute);
    border-radius: 999px; padding: 6px 13px; font: inherit; font-size: 12px;
    cursor: pointer; transition: color .2s, border-color .2s;
  }
  .son:hover { color: var(--ink); border-color: #34302A; }
  .son[aria-pressed="true"] { color: var(--or); border-color: rgba(224,162,55,.45); }

  /* chiffre héros */
  .hero { padding: 52px 0 44px; }
  .hero .quoi {
    font-size: 13px; color: var(--mute); letter-spacing: .04em; margin: 0 0 6px;
  }
  .compteur {
    display: flex; align-items: baseline; gap: 4px;
    font-size: clamp(4.5rem, 15vw, 9rem);
    font-weight: 700; letter-spacing: -0.03em; line-height: .92;
    color: var(--ink);
  }
  .chiffre { position: relative; display: inline-block; overflow: hidden; height: 1em; }
  .chiffre span { display: block; }
  .chiffre span.sort { animation: sortir .5s cubic-bezier(.22,1,.36,1) forwards; position: absolute; inset: 0; }
  .chiffre span.entre { animation: entrer .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes sortir { to { transform: translateY(-108%); opacity: 0; } }
  @keyframes entrer { from { transform: translateY(108%); opacity: 0; } to { transform: none; opacity: 1; } }

  .sous {
    display: flex; flex-wrap: wrap; gap: 30px; margin-top: 24px;
    font-size: 15px; color: var(--mute);
  }
  .sous b { color: var(--or); font-weight: 700; }

  /* corps */
  .corps { display: grid; grid-template-columns: 1.35fr 1fr; gap: 46px; align-items: start; }
  @media (max-width: 820px) { .corps { grid-template-columns: 1fr; gap: 40px; } }

  h2 {
    font-size: 13px; font-weight: 600; color: var(--mute);
    margin: 0 0 20px; letter-spacing: .02em;
  }

  /* barres */
  .barres { display: flex; align-items: flex-end; gap: 3px; height: 168px; }
  .barre { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .barre i {
    display: block; background: #1F1B14; border-radius: 2px 2px 0 0;
    min-height: 2px; transition: height .7s cubic-bezier(.22,1,.36,1), background .4s;
  }
  .barre.actif i { background: var(--or); }
  .barre.maintenant i { background: var(--or); animation: respire 2.4s ease-in-out infinite; }
  @keyframes respire { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .axe { display: flex; gap: 3px; margin-top: 9px; font-size: 10px; color: #4C463C; }
  .axe span { flex: 1; text-align: center; white-space: nowrap; }

  /* flux */
  .flux { list-style: none; margin: 0; padding: 0; }
  .flux li {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--line);
  }
  .flux li.neuf { animation: arrivee .6s cubic-bezier(.22,1,.36,1) both; }
  @keyframes arrivee {
    from { transform: translateY(-10px); opacity: 0; background: rgba(224,162,55,.14); }
    to { transform: none; opacity: 1; background: transparent; }
  }
  .jeton {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: #14120E; color: var(--or); font-size: 13px; font-weight: 700;
  }
  .qui { font-size: 15px; }
  .quand { margin-left: auto; font-size: 12px; color: var(--mute); white-space: nowrap; }

  /* pied */
  .pied {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    margin-top: 52px; background: var(--line);
    border-radius: 14px; overflow: hidden;
  }
  .pied div { background: var(--surface); padding: 22px 20px; }
  .pied .n { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .pied .l { font-size: 12px; color: var(--mute); margin-top: 3px; }

  .erreur { color: #E8534A; font-size: 13px; margin-top: 20px; min-height: 18px; }

  /* parcours d'inscription */
  .parcours { margin: 6px 0 40px; }
  .pbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #14120E; }
  .pbar i { display: block; transition: width .8s cubic-bezier(.22,1,.36,1); }
  .pleg { display: flex; flex-wrap: wrap; gap: 12px 26px; margin-top: 15px; font-size: 13.5px; color: var(--mute); }
  .pleg span { display: inline-flex; align-items: center; gap: 8px; }
  .pleg em { width: 8px; height: 8px; border-radius: 2px; flex: none; font-style: normal; }
  .pleg b { color: var(--ink); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="flash"></div>

<div class="wrap">
  <header>
    <span class="marque">Horsevo</span>
    <span class="live"><i class="pastille"></i>En direct</span>
    <div class="droite">
      <span class="horloge" id="horloge">—</span>
      <button class="son" id="son" aria-pressed="false">🔔 Son</button>
    </div>
  </header>

  <section class="hero">
    <p class="quoi">Comptes créés</p>
    <div class="compteur" id="compteur"></div>
    <div class="sous">
      <span><b id="jour">—</b> aujourd'hui</span>
      <span><b id="h1">—</b> dans la dernière heure</span>
    </div>
    <p class="erreur" id="erreur"></p>
  </section>

  <section class="parcours">
    <h2>Le parcours d'inscription</h2>
    <div class="pbar">
      <i id="p-createurs" style="background:#E0A237"></i>
      <i id="p-invites" style="background:#8A6B2E"></i>
      <i id="p-bloques" style="background:#3A3630"></i>
    </div>
    <div class="pleg">
      <span><em style="background:#E0A237"></em><b id="n-createurs">—</b>&nbsp;ont créé leur écurie</span>
      <span><em style="background:#8A6B2E"></em><b id="n-invites">—</b>&nbsp;ont rejoint une écurie</span>
      <span><em style="background:#3A3630"></em><b id="n-bloques">—</b>&nbsp;décrochés avant l'écurie</span>
    </div>
  </section>

  <div class="corps">
    <section>
      <h2>Les 24 dernières heures</h2>
      <div class="barres" id="barres"></div>
      <div class="axe" id="axe"></div>
    </section>

    <section>
      <h2>Dernières arrivées</h2>
      <ul class="flux" id="flux"></ul>
    </section>
  </div>

  <div class="pied">
    <div><div class="n" id="chevaux">—</div><div class="l">chevaux</div></div>
    <div><div class="n" id="ecuries">—</div><div class="l">écuries</div></div>
    <div><div class="n" id="stories">—</div><div class="l">stories créées<span id="stories-jour"></span></div></div>
  </div>
</div>

<script>
const URL_RPC = "https://dqvmnetwdjidykmqaujg.supabase.co/rest/v1/rpc/live_stats";
const CLE = "sb_publishable_xV_Q76hgY9MFzjUEeFyo0Q_P0JLm1yb";

// Le jeton n'est JAMAIS dans ce fichier : il arrive par le fragment de l'URL
// (la partie après #), qui n'est pas envoyée au serveur et ne figure pas
// dans le dépôt. Sans lui, la page ne montre rien.
const JETON = decodeURIComponent(location.hash.slice(1)).trim();

let precedent = null;
let sonActif = false;
let audioCtx = null;
let dernierAt = null;

/* ---------- son ---------- */
document.getElementById("son").addEventListener("click", (e) => {
  sonActif = !sonActif;
  e.currentTarget.setAttribute("aria-pressed", String(sonActif));
  if (sonActif) {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    carillon(0.25);
  }
});

function carillon(vol = 0.5) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [880, 1320].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * (i ? 0.35 : 1), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.045);
    o.stop(t + 1.2);
  });
}

/* ---------- compteur à rouleaux ---------- */
function poserCompteur(n) {
  const hote = document.getElementById("compteur");
  const chiffres = String(n).split("");
  while (hote.children.length > chiffres.length) hote.removeChild(hote.firstChild);
  while (hote.children.length < chiffres.length) {
    const d = document.createElement("span");
    d.className = "chiffre";
    d.innerHTML = "<span></span>";
    hote.appendChild(d);
  }
  chiffres.forEach((c, i) => {
    const case_ = hote.children[i];
    const actuel = case_.lastElementChild;
    if (actuel.textContent === c) return;
    if (actuel.textContent === "") { actuel.textContent = c; return; }
    actuel.classList.add("sort");
    const neuf = document.createElement("span");
    neuf.className = "entre";
    neuf.textContent = c;
    case_.appendChild(neuf);
    setTimeout(() => actuel.remove(), 520);
  });
}

/* ---------- temps ---------- */
function ilYA(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "à l'instant";
  const m = Math.floor(s / 60);
  if (m < 60) return "il y a " + m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return "il y a " + h + " h";
  return "il y a " + Math.floor(h / 24) + " j";
}

// clé "YYYY-MM-DDTHH" à l'heure de Paris
function cleHeure(d) {
  const s = new Intl.DateTimeFormat("sv-SE", {
    timeZone: "Europe/Paris", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", hour12: false,
  }).format(d);
  return s.slice(0, 10) + "T" + s.slice(11, 13);
}

/* ---------- rendu ---------- */
function rendre(d) {
  const nouveau = precedent !== null && d.comptes > precedent;

  poserCompteur(d.comptes);
  document.getElementById("jour").textContent = d.comptes_jour;
  document.getElementById("h1").textContent = d.comptes_1h;
  document.getElementById("chevaux").textContent = d.chevaux;
  document.getElementById("ecuries").textContent = d.ecuries;
  document.getElementById("stories").textContent = d.stories;
  document.getElementById("stories-jour").textContent =
    d.stories_jour ? ` · ${d.stories_jour} aujourd'hui` : "";

  // Parcours d'inscription : créé son écurie / rejoint une écurie / décroché.
  const cr = d.createurs ?? 0, iv = d.invites ?? 0, bl = d.bloques ?? 0;
  const tot = Math.max(1, cr + iv + bl);
  document.getElementById("p-createurs").style.width = (cr / tot * 100) + "%";
  document.getElementById("p-invites").style.width = (iv / tot * 100) + "%";
  document.getElementById("p-bloques").style.width = (bl / tot * 100) + "%";
  document.getElementById("n-createurs").textContent = cr;
  document.getElementById("n-invites").textContent = iv;
  document.getElementById("n-bloques").textContent = bl;

  if (nouveau) {
    const f = document.getElementById("flash");
    f.classList.add("on");
    setTimeout(() => f.classList.remove("on"), 130);
    if (sonActif) carillon(0.5);
    document.title = "🔔 " + d.comptes + " — Horsevo en direct";
  }

  // barres : 24 dernières heures glissantes
  const par = Object.fromEntries((d.par_heure || []).map((x) => [x.h, x.n]));
  const heures = [];
  for (let i = 23; i >= 0; i--) heures.push(new Date(Date.now() - i * 3600e3));
  const vals = heures.map((h) => par[cleHeure(h)] || 0);
  const max = Math.max(1, ...vals);

  const bh = document.getElementById("barres");
  const ax = document.getElementById("axe");
  if (bh.children.length !== 24) {
    bh.innerHTML = ""; ax.innerHTML = "";
    for (let i = 0; i < 24; i++) {
      const b = document.createElement("div");
      b.className = "barre"; b.innerHTML = "<i></i>";
      bh.appendChild(b);
      const s = document.createElement("span");
      ax.appendChild(s);
    }
  }
  vals.forEach((v, i) => {
    const b = bh.children[i];
    b.querySelector("i").style.height = (v / max * 100) + "%";
    b.className = "barre" + (v > 0 ? " actif" : "") + (i === 23 ? " maintenant" : "");
    const hh = heures[i].toLocaleTimeString("fr-FR", { hour: "2-digit", timeZone: "Europe/Paris" });
    ax.children[i].textContent = (i % 4 === 3) ? hh.replace(":", "") : "";
  });

  // flux
  const flux = document.getElementById("flux");
  const avant = dernierAt;
  flux.innerHTML = "";
  (d.derniers || []).forEach((p) => {
    const li = document.createElement("li");
    const neuf = avant && new Date(p.at) > new Date(avant);
    if (neuf) li.className = "neuf";
    const init = (p.prenom || "?").slice(0, 1).toUpperCase();
    const nom = p.prenom || "Nouveau cavalier";
    const via = p.via === "apple" ? "Apple" : p.via === "google" ? "Google" : "e-mail";
    li.innerHTML =
      '<span class="jeton">' + init + '</span>' +
      '<span class="qui">' + nom + ' <span style="color:var(--mute);font-size:13px">· ' + via + '</span></span>' +
      '<span class="quand" data-at="' + p.at + '">' + ilYA(p.at) + '</span>';
    flux.appendChild(li);
  });
  if (d.derniers && d.derniers.length) dernierAt = d.derniers[0].at;

  precedent = d.comptes;
  document.getElementById("horloge").textContent =
    "mis à jour à " + new Date().toLocaleTimeString("fr-FR");
  document.getElementById("erreur").textContent = "";
}

async function tirer() {
  try {
    const r = await fetch(URL_RPC, {
      method: "POST",
      headers: { "apikey": CLE, "Content-Type": "application/json" },
      body: JSON.stringify({ p_token: JETON }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    rendre(await r.json());
  } catch (e) {
    document.getElementById("erreur").textContent =
      "Connexion perdue, nouvelle tentative… (" + e.message + ")";
  }
}

if (!JETON) {
  document.querySelector(".wrap").innerHTML =
    '<div style="padding:22vh 0;text-align:center">' +
    '<p style="font-size:15px;letter-spacing:.26em;color:#E0A237;font-weight:700">HORSEVO</p>' +
    '<p style="color:#8E8874;font-size:15px;margin-top:18px">Ce tableau de bord demande un lien complet.</p>' +
    '</div>';
} else {
  tirer();
  setInterval(tirer, 4000);
}
setInterval(() => {
  document.querySelectorAll(".quand[data-at]").forEach((el) => {
    el.textContent = ilYA(el.dataset.at);
  });
}, 15000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { document.title = "Horsevo — en direct"; tirer(); }
});
</script>
</body>
</html>
